name: Build CacaoTrace APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Construire l'application
        run: |
          unzip -q CacaoTrace_Projet_Complet_V1.zip
          cd CacaoTrace
          flutter pub get
          flutter build apk --release

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CacaoTrace-APK
          path: CacaoTrace/build/app/outputs/flutter-apk/app-release.apk
